[build-system]
requires = ["scikit-build-core>=0.12.2", "pybind11>=3.0.2"]
build-backend = "scikit_build_core.build"

[project]
name = "digitalannealer"
version = "0.1.0"
description = "High-performance GPU QUBO/Ising solver with OpenJij/dimod-compatible API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Takenori Sumi" }]
keywords = ["Digital Annealer", "Parallel Tempering", "optimization", "qubo", "ising", "gpu", "cuda", "Simulated Annealing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "dimod>=0.12.21",
    "numpy>=2.2.6",
]

[project.urls]
Source = "https://github.com/takes14/digitalannealer.git"

[dependency-groups]
bench = [
    "matplotlib>=3.10.8",
    "openjij>=0.11.6",
]
docs = [
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-rtd-theme>=3.1.0",
]
lint = [
    "clang-format>=22.1.1",
    "ruff>=0.15.6",
    "ty>=0.0.23",
]
test = [
    "cmake>=4.2.3",
    "ninja>=1.13.0",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]
dev = [
    {include-group = "lint"},
    {include-group = "test"},
    "pybind11>=3.0.2",
]

[tool.scikit-build]
cmake.build-type = "Release"
wheel.packages = ["digitalannealer"]

[tool.scikit-build.cmake.define]
DA_ENABLE_IPO = "ON"
DA_AUTO_DETECT_CUDA_ARCH = "ON"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "UP", # pyupgrade
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "PTH", # flake8-use-pathlib
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line too long (handled by formatter)
]

[tool.pytest.ini_options]
testpaths = ["tests/python"]
python_files = ["test_*.py"]
python_functions = ["test_*"]

[tool.ty.rules]
unsupported-operator = "error"
invalid-assignment   = "error"
